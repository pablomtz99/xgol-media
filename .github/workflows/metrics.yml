name: Métricas

on:
  workflow_dispatch:
  schedule:
    - cron: "20 13 * * *"   # 07:20 CDMX, antes de la tarea diaria

permissions:
  contents: write

concurrency:
  group: state
  cancel-in-progress: false

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bajar métricas
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python scripts/metrics.py
      - name: Guardar
        run: |
          git config user.name "xgol-bot"
          git config user.email "xgol-bot@users.noreply.github.com"
          git add metrics
          if ! git diff --cached --quiet; then
            git commit -m "Métricas $(date -u +%F)"
            git pull --rebase origin main || true
            git push
          fi
